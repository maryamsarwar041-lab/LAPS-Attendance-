<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAPS Attendance System</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f5f9;color:#172033}
header{background:#123c73;color:white;padding:15px;text-align:center}
.card{background:white;padding:15px;margin:12px;border-radius:12px}
button,input,select{padding:10px;border-radius:7px;border:1px solid #ccc;font-size:15px}
button{background:#174a87;color:white;border:0;margin:3px;cursor:pointer}
input,select{width:100%;margin:5px 0}
nav{display:flex;flex-wrap:wrap;background:#e1eaf5;padding:8px}
nav button{flex:1;min-width:90px}
table{width:100%;border-collapse:collapse;margin-top:12px}
td,th{border:1px solid #ddd;padding:8px;text-align:left}
th{background:#e8eff8}
.hidden{display:none!important}
#app{max-width:1100px;margin:auto}
</style>
</head>
<body>

<div id="login" class="card" style="max-width:420px;margin:40px auto">
<header><h2>LAPS</h2><p>London Academic Plan School</p></header>
<h3>Attendance Login</h3>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()" style="width:100%">Login</button>
<p id="loginMsg"></p>
</div>

<div id="app" class="hidden">
<header><h2>LAPS</h2><p>London Academic Plan School</p>
<h3>Attendance Management System</h3></header>

<div class="card">Welcome: <b id="userEmail"></b>
<button onclick="logout()">Logout</button></div>

<nav>
<button onclick="showTab('attendance')">Attendance</button>
<button onclick="showTab('students')">Students</button>
<button onclick="showTab('reports')">Reports</button>
<button id="promTab" onclick="showTab('promotion')">Promotion</button>
<button id="settingsTab" onclick="showTab('settings')">Settings</button>
</nav>

<section id="attendance" class="card">
<h3>Daily Attendance</h3>
<label>Date</label><input type="date" id="attDate">
<label>Class</label><select id="attClass" onchange="loadAttendance()"></select>
<button onclick="loadAttendance()">Load Students</button>
<button onclick="markAll('Present')">All Present</button>
<button onclick="markAll('Absent')">All Absent</button>
<div id="attendanceList"></div>
<button onclick="saveAttendance()">Save Attendance</button>
</section>

<section id="students" class="card hidden">
<h3>Student Register</h3>
<div id="addStudentBox">
<input id="stName" placeholder="Student Name">
<input id="stFather" placeholder="Father Name">
<input id="stPhone" placeholder="Parent WhatsApp Number">
<select id="stClass"></select>
<button onclick="addStudent()">Add Student</button>
</div>
<input id="searchStudent" placeholder="Search student..." oninput="renderStudents()">
<div id="studentList"></div>
</section>

<section id="reports" class="card hidden">
<h3>Attendance Reports</h3>
<label>Date</label><input type="date" id="reportDate">
<label>Class</label><select id="reportClass"></select>
<button onclick="makeReport()">View Report</button>
<div id="reportResult"></div>
</section>

<section id="promotion" class="card hidden">
<h3>Class Promotion</h3>
<label>From Class</label><select id="promFrom"></select>
<label>To Class</label><input id="promTo" placeholder="Class 2">
<button onclick="previewPromotion()">Preview Students</button>
<button onclick="selectAllPromotion(true)">Select All</button>
<button onclick="selectAllPromotion(false)">Unselect All</button>
<p id="promCount">Selected: 0</p>
<div id="promotionList"></div>
<button onclick="promoteClass()">Promote Selected Students</button>
</section>

<section id="settings" class="card hidden">
<h3>Admin Settings</h3>
<button onclick="exportStudents()">Export Students CSV</button>
<button onclick="backupData()">Backup Data</button>
<p>Data is saved in Firebase database.</p>
</section>
</div>

<script>
// FIREBASE CONFIG
const firebaseConfig = {
apiKey:"AIzaSyBTlS98na0XljQUKaOU-_s3J2Seyy1BuIo",
authDomain:"laps-attendance.firebaseapp.com",
databaseURL:"https://laps-attendance-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"laps-attendance",
storageBucket:"laps-attendance.firebasestorage.app",
messagingSenderId:"723946421153",
appId:"1:723946421153:web:e4c35ee964c48ca6c429e0",
measurementId:"G-5MG5W8Q444"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();

// ADMIN EMAIL
const ADMIN_EMAIL="msarwars226@gmail.com";

let user=null,isAdmin=false;
let students={},records={},attendanceStatus={},promotionSelection={};

const classes=["Montessori","Step 1","Step 2","Step 3",
"Class 1","Class 2","Class 3","Class 4","Class 5",
"Class 6","Class 7","Class 8","Class 9","Class 10"];

function today(){
return new Date().toLocaleDateString("en-CA");
}

document.getElementById("attDate").value=today();
document.getElementById("reportDate").value=today();

function fillClasses(){
["attClass","stClass","reportClass","promFrom"].forEach(id=>{
document.getElementById(id).innerHTML=
classes.map(c=>`<option>${c}</option>`).join("");
});
}
fillClasses();

// LOGIN
function login(){
let e=document.getElementById("email").value.trim();
let p=document.getElementById("password").value;
auth.signInWithEmailAndPassword(e,p)
.catch(err=>document.getElementById("loginMsg").innerText=err.message);
}
function logout(){auth.signOut()}

// AUTH
auth.onAuthStateChanged(u=>{
if(!u){
document.getElementById("login").classList.remove("hidden");
document.getElementById("app").classList.add("hidden");
return;
}
user=u;
isAdmin=(u.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase();

document.getElementById("login").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");
document.getElementById("userEmail").innerText=u.email;
document.getElementById("promTab").classList.toggle("hidden",!isAdmin);
document.getElementById("settingsTab").classList.toggle("hidden",!isAdmin);
document.getElementById("addStudentBox").classList.toggle("hidden",!isAdmin);

db.ref("students").on("value",s=>{
students=s.val()||{};
renderStudents();
loadAttendance();
});
db.ref("attendance").on("value",s=>{
records=s.val()||{};
loadAttendance();
});
});

function showTab(id){
document.querySelectorAll("#app section").forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
if(id==="attendance")loadAttendance();
if(id==="students")renderStudents();
}

// ADD STUDENT
function addStudent(){
if(!isAdmin)return alert("Admin only");
let name=document.getElementById("stName").value.trim();
if(!name)return alert("Student name required");

let student={
name,
father:document.getElementById("stFather").value,
phone:document.getElementById("stPhone").value,
class:document.getElementById("stClass").value,
active:true
};

db.ref("students").push(student).then(()=>{
["stName","stFather","stPhone"].forEach(id=>document.getElementById(id).value="");
alert("Student added");
});
}

// STUDENTS
function renderStudents(){
let q=(document.getElementById("searchStudent").value||"").toLowerCase();
let html="<table><tr><th>Name</th><th>Father</th><th>Class</th><th>Action</th></tr>";

Object.entries(students).forEach(([id,s])=>{
if(!s.active)return;
if(!(`${s.name} ${s.father} ${s.class}`.toLowerCase().includes(q)))return;
html+=`<tr><td>${esc(s.name)}</td><td>${esc(s.father||"")}</td><td>${esc(s.class)}</td>
<td>${isAdmin?`<button onclick="deleteStudent('${id}')">Delete</button>`:"-"}</td></tr>`;
});
document.getElementById("studentList").innerHTML=html+"</table>";
}

function deleteStudent(id){
if(!isAdmin)return;
if(confirm("Delete this student?"))db.ref("students/"+id).remove();
}

// ATTENDANCE
function loadAttendance(){
if(!user)return;
let cls=document.getElementById("attClass").value;
let date=document.getElementById("attDate").value;
attendanceStatus={};
let html="<table><tr><th>Student</th><th>Status</th><th>WhatsApp</th></tr>";

Object.entries(students).forEach(([id,s])=>{
if(!s.active||s.class!==cls)return;
let old=records[date]?.[id]?.status||"Present";
attendanceStatus[id]=old;
html+=`<tr><td>${esc(s.name)}</td><td>
<select onchange="setStatus('${id}',this.value)">
${["Present","Absent","Leave"].map(x=>`<option ${x===old?"selected":""}>${x}</option>`).join("")}
</select></td><td><button onclick="sendWA('${id}')">WhatsApp</button></td></tr>`;
});
document.getElementById("attendanceList").innerHTML=html+"</table>";
}

function setStatus(id,v){attendanceStatus[id]=v}

function markAll(v){
Object.entries(students).forEach(([id,s])=>{
if(s.active&&s.class===document.getElementById("attClass").value)
attendanceStatus[id]=v;
});
loadAttendance();
Object.keys(attendanceStatus).forEach(id=>attendanceStatus[id]=v);
loadAttendance();
}

function saveAttendance(){
let date=document.getElementById("attDate").value,updates={};
Object.entries(attendanceStatus).forEach(([id,status])=>{
updates[`${date}/${id}`]={status,studentName:students[id]?.name||"",class:students[id]?.class||""};
});
db.ref("attendance").update(updates).then(()=>alert("Attendance saved"));
}

function sendWA(id){
let s=students[id];
if(!s.phone)return alert("Parent phone number missing");
let phone=s.phone.replace(/\D/g,"").replace(/^0/,"92");
let msg=`Assalam o Alaikum. ${s.name} is marked absent today at LAPS London Academic Plan School.`;
window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,"_blank");
}

// REPORT
function makeReport(){
let date=document.getElementById("reportDate").value;
let cls=document.getElementById("reportClass").value;
let p=0,a=0,l=0,html="<table><tr><th>Name</th><th>Status</th></tr>";

Object.entries(students).forEach(([id,s])=>{
if(!s.active||s.class!==cls)return;
let status=records[date]?.[id]?.status||"Not marked";
if(status==="Present")p++;
if(status==="Absent")a++;
if(status==="Leave")l++;
html+=`<tr><td>${esc(s.name)}</td><td>${status}</td></tr>`;
});
document.getElementById("reportResult").innerHTML=
`<p>Present: ${p} | Absent: ${a} | Leave: ${l}</p>${html}</table>`;
}

// PROMOTION
function previewPromotion(){
if(!isAdmin)return;
let cls=document.getElementById("promFrom").value;
promotionSelection={};
let html="<table><tr><th>Select</th><th>Name</th></tr>";

Object.entries(students).forEach(([id,s])=>{
if(s.active&&s.class===cls){
promotionSelection[id]=true;
html+=`<tr><td><input type="checkbox" checked onchange="togglePromotion('${id}',this.checked)"></td><td>${esc(s.name)}</td></tr>`;
}
});
document.getElementById("promotionList").innerHTML=html+"</table>";
updatePromotionCount();
}

function togglePromotion(id,v){
promotionSelection[id]=v;
updatePromotionCount();
}

function selectAllPromotion(v){
Object.keys(promotionSelection).forEach(id=>promotionSelection[id]=v);
document.querySelectorAll("#promotionList input[type=checkbox]").forEach(x=>x.checked=v);
updatePromotionCount();
}

function updatePromotionCount(){
document.getElementById("promCount").innerText=
"Selected: "+Object.values(promotionSelection).filter(Boolean).length;
}

function promoteClass(){
if(!isAdmin)return alert("Admin only");
let to=document.getElementById("promTo").value.trim();
if(!to)return alert("Enter target class");
let selected=Object.keys(promotionSelection).filter(id=>promotionSelection[id]);
if(!selected.length)return alert("Select students first");
if(!confirm("Promote "+selected.length+" students to "+to+"?"))return;
let updates={};
selected.forEach(id=>updates[id+"/class"]=to);
db.ref("students").update(updates).then(()=>{
alert("Selected students promoted");
previewPromotion();
});
}

// EXPORT / BACKUP
function exportStudents(){
let csv="Name,Father,Phone,Class\n";
Object.values(students).forEach(s=>{
if(s.active)csv+=`${s.name},${s.father||""},${s.phone||""},${s.class}\n`;
});
download(csv,"LAPS-Students.csv");
}

function backupData(){
download(JSON.stringify({students,attendance:records},null,2),"LAPS-Backup.json");
}

function download(data,name){
let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([data],{type:"text/plain"}));
a.download=name;a.click();
}

function esc(s){
return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
</script>
</body>
  </html>
