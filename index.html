<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAPS Attendance</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#123b65">

<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f3f6fa;color:#172033}
header{background:#123b65;color:white;padding:16px;text-align:center}
main{max-width:1000px;margin:auto;padding:14px}
.card{background:white;padding:16px;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px #0001}
input,select,button{padding:10px;margin:5px 2px;border:1px solid #ccd4df;border-radius:7px;font-size:15px}
button{background:#123b65;color:white;border:0;cursor:pointer}
button.secondary{background:#64748b}
button.danger{background:#b42318}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #dbe1e8;padding:8px;text-align:left}
th{background:#edf2f7}
.hidden{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:130px}
.small{font-size:12px;color:#667085}
@media(max-width:600px){table{font-size:13px}th,td{padding:5px}}
</style>
</head>

<body>
<header>
<h2>LAPS London Academic Plan School</h2>
<div>Attendance Management</div>
</header>

<main>
<section class="card" id="loginBox">
<h3>Login</h3>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p class="small">Authorized school staff only.</p>
</section>

<section id="app" class="hidden">

<div class="card row">
<div id="welcome"></div>
<button class="secondary" onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>Student Register</h3>
<div class="row">
<input id="sname" placeholder="Student name">
<input id="sclass" placeholder="Class">
<input id="sphone" placeholder="Parent WhatsApp (03...)">
<button id="addStudentBtn" onclick="addStudent()">Add Student</button>
</div>

<table>
<thead><tr><th>Name</th><th>Class</th><th>Parent phone</th><th>Action</th></tr></thead>
<tbody id="studentRows"></tbody>
</table>
</div>

<div class="card">
<h3>Daily Attendance</h3>
<div class="row">
<input type="date" id="date">
<select id="classFilter" onchange="loadAttendance()">
<option value="">All classes</option>
</select>
<button onclick="loadAttendance()">Load</button>
<button class="secondary" onclick="markAll('Present')">All Present</button>
<button class="secondary" onclick="markAll('Absent')">All Absent</button>
</div>

<table>
<thead><tr><th>Student</th><th>Status</th><th>Parent</th></tr></thead>
<tbody id="attendanceRows"></tbody>
</table>

<button onclick="saveAttendance()">Save Attendance</button>
</div>

<div class="card">
<h3>Attendance Report</h3>
<div class="row">
<input type="date" id="reportDate">
<button onclick="report()">Show Report</button>
<button class="secondary" onclick="exportCSV()">Export Students CSV</button>
</div>
<div id="reportOut"></div>
</div>

</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig={
 apiKey:"AIzaSyBTlS98na0XljQUKaOU-_s3J2Seyy1BuIo",
 authDomain:"laps-attendance.firebaseapp.com",
 databaseURL:"https://laps-attendance-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"laps-attendance",
 storageBucket:"laps-attendance.appspot.com",
 messagingSenderId:"723946421153",
 appId:"1:723946421153:web:e4c35ee964c48ca6c429e0",
 measurementId:"G-5MG5W8Q444"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.database();
const ADMIN="msarwars226@gmail.com";

let user=null;
let isAdmin=false;
let students={};
let records={};
let attendanceStatus={};
let attendanceScope="";

document.getElementById("date").value=new Date().toISOString().slice(0,10);
document.getElementById("reportDate").value=document.getElementById("date").value;

auth.onAuthStateChanged(async u=>{
 user=u;

 document.getElementById("loginBox").classList.toggle("hidden",!!u);
 document.getElementById("app").classList.toggle("hidden",!u);

 if(u){
  isAdmin=(u.email||"").toLowerCase()===ADMIN.toLowerCase();
  document.getElementById("welcome").textContent="Logged in: "+u.email;
  document.getElementById("addStudentBtn").classList.toggle("hidden",!isAdmin);

  await loadStudents();
  await loadAttendance();
 }
});

async function login(){
 try{
  await auth.signInWithEmailAndPassword(email.value.trim(),password.value);
 }catch(e){
  alert(e.message);
 }
}

function logout(){
 auth.signOut();
}

async function loadStudents(){
 const s=await db.ref("students").once("value");
 students=s.val()||{};
 renderStudents();
 populateClasses();
}

function renderStudents(){
 studentRows.innerHTML=Object.entries(students).map(([id,s])=>
 `<tr>
 <td>${esc(s.name)}</td>
 <td>${esc(s.class)}</td>
 <td>${esc(s.phone||"")}</td>
 <td>${isAdmin?`<button class="danger" onclick="deleteStudent('${id}')">Delete</button>`:"-"}</td>
 </tr>`
 ).join("");
}

async function addStudent(){
 if(!isAdmin)return alert("Admin only");

 const name=sname.value.trim();
 const cls=sclass.value.trim();
 const phone=sphone.value.trim();

 if(!name||!cls){
  alert("Student name aur class likhein");
  return;
 }

 const ref=db.ref("students").push();
 await ref.set({name,class:cls,phone});

 sname.value="";
 sclass.value="";
 sphone.value="";

 await loadStudents();
}

async function deleteStudent(id){
 if(!isAdmin)return alert("Admin only");

 if(confirm("Student delete karna hai?")){
  await db.ref("students/"+id).remove();
  await loadStudents();
  loadAttendance();
 }
}

function populateClasses(){
 const classes=[...new Set(Object.values(students).map(s=>s.class))].sort();

 classFilter.innerHTML=
 '<option value="">All classes</option>'+
 classes.map(c=>`<option>${esc(c)}</option>`).join("");
}

async function loadAttendance(){
 if(!user)return;

 const date=document.getElementById("date").value;
 const cls=classFilter.value;
 const scope=date+"|"+cls;

 if(scope!==attendanceScope){
  attendanceStatus={};
  attendanceScope=scope;
 }

 const snap=await db.ref("attendance/"+date).once("value");
 records[date]=snap.val()||{};

 const list=Object.entries(students).filter(([id,s])=>
 s.active!==false&&(!cls||s.class===cls)
 );

 attendanceRows.innerHTML=list.map(([id,s])=>{
 const status=attendanceStatus[id]??records[date][id]?.status??"Present";
 attendanceStatus[id]=status;

 return `<tr>
 <td>${esc(s.name)} <span class="small">(${esc(s.class)})</span></td>
 <td>
 <select onchange="setStatus('${id}',this.value)">
 <option ${status==="Present"?"selected":""}>Present</option>
 <option ${status==="Absent"?"selected":""}>Absent</option>
 <option ${status==="Leave"?"selected":""}>Leave</option>
 </select>
 </td>
 <td>${isAdmin&&status==="Absent"?`<button onclick="sendWA('${id}')">WhatsApp</button>`:"-"}</td>
 </tr>`;
 }).join("");
}

function setStatus(id,v){
 attendanceStatus[id]=v;
 loadAttendance();
}

function markAll(v){
 Object.entries(students)
 .filter(([id,s])=>s.active!==false&&(!classFilter.value||s.class===classFilter.value))
 .forEach(([id])=>attendanceStatus[id]=v);

 loadAttendance();
}

async function saveAttendance(){
 const date=document.getElementById("date").value;
 const updates={};

 Object.entries(attendanceStatus).forEach(([id,status])=>{
  updates[id]={
   status,
   studentName:students[id]?.name||"",
   class:students[id]?.class||""
  };
 });

 await db.ref("attendance/"+date).update(updates);

 alert("Attendance save ho gai");
 loadAttendance();
}

function sendWA(id){
 if(!isAdmin)return alert("Admin only");

 const s=students[id];

 if(!s?.phone){
  alert("Parent phone number available nahi");
  return;
 }

 const phone=s.phone.replace(/\D/g,"").replace(/^0/,"92");

 const msg=`Assalam-o-Alaikum Dear Parents,

Your child ${s.name} was marked Absent today from LAPS London Academic Plan School.

Kindly share the reason for your child's absence.

Thank you for your cooperation.

Regards,
LAPS Administration`;

 window.open(
 "https://wa.me/"+phone+"?text="+encodeURIComponent(msg),
 "_blank"
 );
}

async function report(){
 const d=reportDate.value;
 const s=await db.ref("attendance/"+d).once("value");
 const r=s.val()||{};
 const counts={Present:0,Absent:0,Leave:0};

 Object.values(r).forEach(x=>
 counts[x.status]=(counts[x.status]||0)+1
 );

 reportOut.innerHTML=
 `<p>Date: ${d}</p>
 <p>Present: ${counts.Present||0} |
 Absent: ${counts.Absent||0} |
 Leave: ${counts.Leave||0}</p>`;
}

function exportCSV(){
 const rows=[
 ["Name","Class","Parent Phone"],
 ...Object.values(students).map(s=>[s.name,s.class,s.phone||""])
 ];

 const csv=rows.map(r=>
 r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(",")
 ).join("\n");

 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
 a.download="LAPS_Students.csv";
 a.click();
}

function esc(x){
 return String(x??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#39;"
 }[c]));
}

if("serviceWorker" in navigator){
 navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
